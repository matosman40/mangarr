<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mangarr{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
<header>
  <a class="brand" href="/">Mangarr</a>
  <nav>
    <a href="/">Mangas</a>
    <a href="/add">Ajouter</a>
    <a href="/sources">Sources</a>
    <a href="/patreon">Patreon</a>
    <a href="/logs">Journaux</a>
  </nav>
  <div class="spacer"></div>
  {% if busy %}<span class="badge busy">vérification en cours…</span>{% endif %}
  <form method="post" action="/check"><button class="btn primary" {{ 'disabled' if busy }}>Tout vérifier</button></form>
  {% if auth_enabled %}<form method="post" action="/logout"><button class="btn">Déconnexion</button></form>{% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
<footer>Mangarr {{ version }}</footer>
</body>
</html>
